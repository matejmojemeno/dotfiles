# ~/.config/tmux/tmux.conf
# Goal: tmux as an invisible pane layer under Ghostty. No status bar, no
# visible chrome — Ghostty with splits and smart-splits.nvim navigation.

# ── Terminal / colors ───────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g allow-passthrough on          # let apps (image protocols, OSC) talk to Ghostty
set -as terminal-features ",xterm-ghostty:usstyle"   # undercurl/underline colors

set -sg escape-time 0                # or <Esc> lags in nvim and alt-keys break
set -g focus-events on               # nvim autoread / smart-splits need this
set -g history-limit 100000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

# ── Invisible chrome ────────────────────────────────────────────────────────
set -g status off
# tokyonight-moon pane borders (nearly invisible until you have splits)
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"
set -g pane-border-lines single
set -g display-panes-time 2000

# Sessions survive detaching, so a crashed/closed Ghostty window can be
# recovered with `tmux ls` + `tmux attach -t <name>`. Flip to 'on' if you'd
# rather sessions be destroyed the moment nothing is attached — but note that
# also destroys a session the instant you press prefix+d.
set -g destroy-unattached off

# ── Prefix-less bindings (your wezterm muscle memory) ───────────────────────
bind -n M-s split-window -v -c "#{pane_current_path}"     # was alt+s
bind -n M-v split-window -h -c "#{pane_current_path}"     # was alt+v
bind -n M-m resize-pane -Z                                # was ctrl+m zoom
bind -n M-o rotate-window                                 # was alt+o (wezterm RotatePanes)
bind -n M-w kill-pane

# New windows/panes open in the current directory
bind c new-window -c "#{pane_current_path}"

# ── Fixed workspace slots: alt+<number> ─────────────────────────────────────
# Six generic full-screen windows (the status bar is off, so a window *is* the
# whole Ghostty window), created up front by ghostty-session.sh and numbered
# 1..6. Run whatever you like in each — nvim in 1, claude in 3, whatever. The
# numbering never drifts: goto-window.sh recreates a slot you closed.
set -g renumber-windows off          # slots must keep their index when one closes
set -g allow-rename off              # ...and their name
setw -g automatic-rename off

bind -n M-1 run-shell '$HOME/.config/tmux/goto-window.sh 1'
bind -n M-2 run-shell '$HOME/.config/tmux/goto-window.sh 2'
bind -n M-3 run-shell '$HOME/.config/tmux/goto-window.sh 3'
bind -n M-4 run-shell '$HOME/.config/tmux/goto-window.sh 4'
bind -n M-5 run-shell '$HOME/.config/tmux/goto-window.sh 5'
bind -n M-6 run-shell '$HOME/.config/tmux/goto-window.sh 6'

# Reset the current slot: SIGKILL whatever is in it (wedged ssh, runaway proc)
# and start a fresh shell, keeping the slot's index and name. Prefix'd and
# capitalised on purpose — it's destructive.
bind R respawn-window -k -c "#{pane_current_path}"

# shift+up/down scroll by one line (your wezterm binding); passed through
# untouched when neovim has focus.
bind -n S-Up   if -F "#{@pane-is-vim}" { send-keys S-Up }   { copy-mode -e ; send -X scroll-up }
bind -n S-Down if -F "#{@pane-is-vim}" { send-keys S-Down } { copy-mode -e ; send -X scroll-down }

# ── smart-splits.nvim integration ───────────────────────────────────────────
# '@pane-is-vim' is set by smart-splits.nvim on load and unset when nvim exits,
# so these keys go to nvim when nvim has focus and move tmux panes otherwise.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if -F "#{@pane-is-vim}" 'send-keys C-\\' 'select-pane -l'

bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ── Copy mode ───────────────────────────────────────────────────────────────
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Machine-local overrides (optional, gitignored, loaded last so it wins)
source -q ~/.config/tmux/tmux.local.conf
